    <script>
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'panel-pro-offline-v9';
                self.addEventListener('install', (e) => {
                    self.skipWaiting();
                });
                self.addEventListener('fetch', (e) => {
                    if (e.request.method !== 'GET') return;
                    e.respondWith(
                        fetch(e.request).then((response) => {
                            const clone = response.clone();
                            caches.open(CACHE_NAME).then((cache) => cache.put(e.request, clone));
                            return response;
                        }).catch(() => caches.match(e.request))
                    );
                });
            `;
            const blob = new Blob([swCode], {type: 'application/javascript'});
            const swUrl = URL.createObjectURL(blob);
            window.addEventListener('load', () => {
                navigator.serviceWorker.register(swUrl)
                    .then(() => console.log('PWA: Modo Offline Agresivo Activado'))
                    .catch(() => console.log('SW bypass normal en desarrollo'));
            });
        }

        let audioCtx = null;
        const unlockAudio = () => {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        };

        document.addEventListener('touchstart', unlockAudio, { once: true });
        document.addEventListener('click', unlockAudio, { once: true });

        const playAlarm = () => {
            try {
                if (!audioCtx) unlockAudio();
                if (!audioCtx) return;
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); 
                oscillator.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.2); 
                gainNode.gain.setValueAtTime(1, audioCtx.currentTime); 
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.6); 
            } catch(e) { console.log("Audio falló", e); }
        };

        function ExerciseRow({ exercise, clientProgress, onUpdate, onDelete, onMoveUp, onMoveDown, isFirst, isLast }) {
            const [localEx, setLocalEx] = useState(exercise);
            const [editWeek, setEditWeek] = useState(1); 
            const [showInfoModal, setShowInfoModal] = useState(false);
            
            const localExRef = useRef(exercise);

            useEffect(() => {
                setLocalEx(exercise);
                localExRef.current = exercise;
            }, [exercise]);

            const updateLocalAndRef = (updated) => {
                setLocalEx(updated);
                localExRef.current = updated;
            };

            const handleChange = (field, value) => {
                updateLocalAndRef({ ...localEx, [field]: value });
            };

            const handleWeekConfigChange = (weekNum, field, value) => {
                const updatedWeeks = JSON.parse(JSON.stringify(localEx.weeks || {}));
                if (!updatedWeeks[weekNum]) {
                    updatedWeeks[weekNum] = { sets: localEx.sets ?? '4', reps: localEx.reps ?? '10', rir: localEx.rir ?? '2' };
                }
                updatedWeeks[weekNum][field] = value;
                updateLocalAndRef({ ...localEx, weeks: updatedWeeks });
            };
            
            const handleBlur = () => {
                onUpdate(localExRef.current);
            };

            const currentWeekData = localEx.weeks?.[editWeek] || { sets: localEx.sets ?? '4', reps: localEx.reps ?? '10', rir: localEx.rir ?? '2' };

            const exerciseNotes = [];
            if (clientProgress) {
                [1,2,3,4].forEach(w => {
                    const note = clientProgress[w]?.[localEx.id]?.note;
                    if (note && note.trim() !== '') {
                        exerciseNotes.push({ week: w, note });
                    }
                });
            }

                <div className="glass-panel p-4 rounded-2xl mb-4 relative z-10 shadow-xl border border-white/5">

                        <ExerciseInfoModal 
                            exercise={localEx} 
                            isTeacher={true}

                    <div className="mt-3 pt-3 border-t border-dark-600 flex items-center gap-2.5">
                        <input type="checkbox" id={`uni-${localEx.id}`} checked={localEx.isUnilateral ?? false} onChange={(e) => {
                            const updated = { ...localEx, isUnilateral: e.target.checked };
                            updateLocalAndRef(updated);
                            onUpdate(updated); 
                        }} className="w-4 h-4 accent-brand-500 rounded cursor-pointer" />
                        <label htmlFor={`uni-${localEx.id}`} className="text-xs text-gray-300 cursor-pointer select-none font-medium">Ejercicio Unilateral (Separar Izq/Der)</label>
                    </div>

                    <div className="mt-3">
                        <textarea 
                            className="w-full bg-dark-900/80 text-gray-200 p-3 rounded-xl outline-none border border-dark-600 focus:border-brand-500 text-sm resize-none box-border"
                            rows="2"
                            placeholder="Aclaraciones o notas rápida para la sesión..."
                            value={localEx.coachNote ?? ''}
                            onChange={(e) => handleChange('coachNote', e.target.value)}
                            onBlur={handleBlur}
                        />
                    </div>

                    {exerciseNotes.length > 0 && (
                        <div className="mt-3 bg-brand-500/10 p-3 rounded-xl border border-brand-500/30">
                            <span className="text-brand-500 text-xs font-bold flex items-center gap-2 mb-2"><i className="fa-solid fa-comment-dots"></i> Feedback del alumno:</span>
                            {exerciseNotes.map(en => (
                                <div key={en.week} className="text-xs text-gray-300 mb-1 last:mb-0"><strong className="text-brand-500">Semana {en.week}:</strong> {en.note}</div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        function ClientExerciseRow({ exercise, activeWeek, progressData, previousWeekData, allWeeksData, onSaveProgress, onStartRest, showToast }) {
            const weekConfig = exercise.weeks?.[activeWeek] || { sets: exercise.sets || '4', reps: exercise.reps || '10', rir: exercise.rir || '2' };
            const baseSetsCount = parseInt(weekConfig.sets) || 1;
            const isUni = exercise.isUnilateral === true;
            const totalRows = isUni ? baseSetsCount * 2 : baseSetsCount;

            const [showNotes, setShowNotes] = useState(false);
            const [showHistory, setShowHistory] = useState(false);
            const [showInfoModal, setShowInfoModal] = useState(false);
            
            const [localNote, setLocalNote] = useState(progressData?.note ?? '');
            const [localSets, setLocalSets] = useState([]);

            const localSetsRef = useRef(localSets);
            const localNoteRef = useRef(localNote);

            const commitSets = (newSets) => {
                localSetsRef.current = newSets;
                setLocalSets(newSets);
                onSaveProgress(newSets, localNoteRef.current);
            };

            useEffect(() => {
                const saved = progressData?.sets || [];
                let newSets = [...saved];
                
                if (newSets.length < totalRows) {
                    for (let i = newSets.length; i < totalRows; i++) {
                        newSets.push({ weight: '', reps: '', rir: '', done: false, type: 'N' });
                    }
                } 

                setLocalSets(newSets);
                localSetsRef.current = newSets;
                setLocalNote(progressData?.note ?? '');
                localNoteRef.current = progressData?.note ?? '';
            }, [progressData, totalRows, activeWeek]);

            const updateSetLocal = (index, field, value) => {
                const newSets = [...localSetsRef.current];
                newSets[index] = { ...newSets[index], [field]: value };
                localSetsRef.current = newSets;
                setLocalSets(newSets);
            };

            const handleSetBlur = () => { 
                onSaveProgress(localSetsRef.current, localNoteRef.current); 
            };

            const toggleDone = (e, index) => {
                e.preventDefault();
                e.stopPropagation();
                unlockAudio();
                const newSets = [...localSetsRef.current];
                const wasDone = newSets[index].done;
                newSets[index] = { ...newSets[index], done: !wasDone };
                commitSets(newSets);
                if (!wasDone) onStartRest(exercise.rest || '90s');
            };

            const handleNoteChange = (e) => { 
                localNoteRef.current = e.target.value;
                setLocalNote(e.target.value); 
            };
            
            const handleNoteBlur = () => { 
                onSaveProgress(localSetsRef.current, localNoteRef.current); 
            };

            const addSet = () => {
                const addCount = isUni ? 2 : 1;
                const newSets = [...localSetsRef.current];
                for(let i=0; i<addCount; i++){
                    newSets.push({ weight: '', reps: '', rir: '', done: false, type: 'N' });
                }
                commitSets(newSets);
            };

            const removeLastSet = () => {
                const removeCount = isUni ? 2 : 1;
                const newSets = [...localSetsRef.current];
                if (newSets.length > removeCount) { 
                    newSets.splice(-removeCount, removeCount);
                    commitSets(newSets);
                } else {
                    showToast('Debe quedar al menos una serie en el ejercicio', 'error');
                }
            };

            const cycleSetType = (e, index) => {
                e.preventDefault();
                e.stopPropagation();
                const types = ['N', 'W', 'D'];
                const current = localSetsRef.current[index].type || 'N';
                const next = types[(types.indexOf(current) + 1) % types.length];
                const newSets = [...localSetsRef.current];
                newSets[index] = { ...newSets[index], type: next };
                
                commitSets(newSets);
                
                if (next === 'W') showToast('Warm-up (W): Serie de calentamiento', 'info');
                else if (next === 'D') showToast('Drop-set (D): Serie al fallo o descendente', 'info');
                else showToast('Serie Normal', 'info');
            };

            const adjustWeight = (e, index, amount) => {
                e.preventDefault();
                e.stopPropagation();
                let currentStr = localSetsRef.current[index].weight || '';
                currentStr = currentStr.toString().replace(',', '.');
                let currentVal = parseFloat(currentStr);
                if (isNaN(currentVal)) currentVal = 0;
                
                let newVal = Math.max(0, currentVal + amount);
                let finalStr = newVal === 0 ? '' : newVal.toString();
                
                const newSets = [...localSetsRef.current];
                newSets[index] = { ...newSets[index], weight: finalStr };
                
                commitSets(newSets);
            };

            return (
                <div className="mb-10 relative z-10">
                    {showInfoModal && (
                        <ExerciseInfoModal 
                            exercise={exercise} 
                            isTeacher={false} 
                            onClose={() => setShowInfoModal(false)} 
                        />
                    )}

                    <div className="flex items-center justify-between mb-4">
                        <div className="flex items-center gap-3">
                            <div className="w-11 h-11 bg-dark-700 rounded-2xl flex items-center justify-center text-brand-500 shadow-lg border border-white/5 overflow-hidden">
                                {exercise.image ? (
                                    <img src={exercise.image} alt={exercise.name} className="w-full h-full object-cover" />
                                ) : (
                                    <i className="fa-solid fa-dumbbell text-lg"></i>
                                )}
                            </div>
                            <div>
                                <h4 onClick={() => setShowInfoModal(true)} className="font-bold text-base text-white leading-tight tracking-wide cursor-pointer hover:text-brand-500 flex items-center gap-1.5 transition-colors group">
                                    {exercise.name} <i className="fa-solid fa-circle-info text-xs text-brand-500 opacity-60 group-hover:opacity-100 transition-opacity"></i>
                                </h4>
                                <span className="text-xs text-brand-500 font-semibold">Sem. {activeWeek} • Pauta: {weekConfig.sets} x {weekConfig.reps} (RIR {weekConfig.rir || exercise.rir || '2'})</span>
                            </div>
                        </div>
                    </div>

                    {exercise.coachNote && (
                        <div className="bg-dark-800/90 border-l-4 border-brand-500 p-3 rounded-r-xl mb-4 flex gap-3 items-start shadow-inner">
                            <i className="fa-solid fa-circle-info text-brand-500 mt-0.5"></i>
                            <p className="text-xs text-gray-300 whitespace-pre-wrap leading-relaxed">{exercise.coachNote}</p>
                        </div>
                    )}

                    <div className="flex gap-2 mb-4">
                        <button onClick={() => {setShowHistory(!showHistory); setShowNotes(false);}} className={`text-xs font-bold px-4 py-2 rounded-xl flex items-center gap-2 transition-all border ${showHistory ? 'bg-brand-500 text-white border-brand-500 shadow-md shadow-brand-500/25' : 'bg-dark-800 text-gray-300 border-dark-600 hover:bg-dark-700'}`}>
                            <i className="fa-solid fa-clock-rotate-left"></i> Historial
                        </button>
                        <button onClick={() => {setShowNotes(!showNotes); setShowHistory(false);}} className={`text-xs font-bold px-4 py-2 rounded-xl flex items-center gap-2 transition-all border ${showNotes ? 'bg-brand-500 text-white border-brand-500 shadow-md shadow-brand-500/25' : 'bg-dark-800 text-gray-300 border-dark-600 hover:bg-dark-700'}`}>
                            <i className="fa-solid fa-pencil"></i> Notas personales
                        </button>
                    </div>

                    {showNotes && (
                        <div className="mb-4 animate-fade-in origin-top w-full box-border">
                            <textarea 
                                value={localNote} 
                                onChange={handleNoteChange} 
                                onBlur={handleNoteBlur}
                                placeholder="Anotá acá sensaciones, carga de máquina, etc..." 
                                className="w-full bg-dark-800 text-white p-3 rounded-xl outline-none border border-dark-600 focus:border-brand-500 text-sm resize-none h-24 shadow-inner box-border block"
                            />
                        </div>
                    )}

                    {showHistory && (
                        <div className="mb-4 bg-dark-800 p-4 rounded-xl border border-dark-600 animate-fade-in origin-top shadow-inner text-xs">
                            <h5 className="font-bold text-white mb-3 flex items-center gap-2"><i className="fa-solid fa-chart-simple text-brand-500"></i> Tus marcas este mesociclo</h5>
                            {[1, 2, 3, 4].map(w => {
                                const wData = allWeeksData?.[w]?.[exercise.id]?.sets;
                                if (!wData || wData.length === 0) return null;
                                return (
                                    <div key={w} className="mb-3 pb-3 border-b border-dark-700 last:border-0 last:mb-0 last:pb-0 text-gray-300">
                                        <span className="text-brand-500 font-bold block mb-1">Semana {w}:</span>
                                        <div className="flex flex-wrap gap-2">
                                            {wData.map((s, idx) => {
                                                if(s.weight && s.reps) return (
                                                    <span key={idx} className="bg-dark-700 px-2.5 py-1 rounded-lg text-xs border border-dark-600">{s.weight}kg x {s.reps} {s.rir !== undefined && s.rir !== '' ? `(RIR ${s.rir})` : ''}</span>
                                                );
                                                return null;
                                            })}
                                        </div>
                                    </div>
                                )
                            })}
                            {!allWeeksData && <p className="text-gray-500 italic">Aún no hay registros en otras semanas.</p>}
                        </div>
                    )}
                    
                    <div className="grid grid-cols-[36px_55px_1fr_70px_50px_42px] gap-1 mb-2 text-[10px] text-gray-400 font-black uppercase tracking-widest px-1 text-center items-center">
                        <span>Set</span>
                        <span>Previa</span>
                        <span>KG (±2.5)</span>
                        <span>Reps/s</span>
                        <span>RIR</span>
                        <span></span>
                    </div>
                    
                    {localSets.map((set, i) => {
                        const prevSet = previousWeekData?.sets?.[i];
                        const prevText = prevSet?.weight && prevSet?.reps ? `${prevSet.weight}x${prevSet.reps}` : '-';
                        
                        const isRight = isUni && (i % 2 !== 0);
                        const setNum = isUni ? Math.floor(i / 2) + 1 : i + 1;
                        const setType = set.type || 'N';
                        
                        let badgeText = setType === 'N' ? setNum : setType;
                        if (isUni) {
                            badgeText = `${badgeText}${isRight ? 'D' : 'I'}`;
                        }

                        let badgeStyle = "bg-dark-800 text-gray-400 border-dark-600";
                        if (setType === 'W') badgeStyle = "bg-orange-950/60 text-orange-400 border-orange-800";
                        else if (setType === 'D') badgeStyle = "bg-red-950/60 text-red-400 border-red-800";
                        else if (isUni) badgeStyle = isRight ? "bg-blue-950/60 text-blue-400 border-blue-900" : "bg-emerald-950/60 text-emerald-400 border-emerald-900";

                        return (
                            <div key={i} className="grid grid-cols-[36px_55px_1fr_70px_50px_42px] gap-1 items-center mb-2.5">
                                <button type="button" onClick={(e) => cycleSetType(e, i)} className={`w-9 h-10 flex items-center justify-center rounded-xl font-black text-xs border cursor-pointer hover:opacity-80 transition-opacity ${badgeStyle}`}>
                                    {badgeText}
                                </button>
                                
                                <div className="text-center text-gray-500 text-xs font-semibold truncate">
                                    {prevText}
                                </div>

                                <div className="flex items-center bg-dark-800 rounded-xl border border-dark-600 focus-within:border-brand-500 overflow-hidden shadow-inner w-full">
                                    <button type="button" onClick={(e) => adjustWeight(e, i, -2.5)} className="w-7 h-10 text-gray-400 hover:text-white hover:bg-dark-700 transition-colors text-xs font-bold flex items-center justify-center shrink-0">-</button>
                                    <input 
                                        type="text" 
                                        inputMode="decimal"
                                        className="w-full bg-transparent py-2.5 text-white outline-none text-center font-bold text-sm" 
                                        placeholder="-" 
                                        value={set.weight ?? ''} 
                                        onChange={(e) => updateSetLocal(i, 'weight', e.target.value)} 
                                        onBlur={handleSetBlur}
                                    />
                                    <button type="button" onClick={(e) => adjustWeight(e, i, 2.5)} className="w-7 h-10 text-gray-400 hover:text-white hover:bg-dark-700 transition-colors text-xs font-bold flex items-center justify-center shrink-0">+</button>
                                </div>
                                
                                <input 
                                    type="text" 
                                    className="w-full bg-dark-800 rounded-xl py-2.5 text-white outline-none text-center font-bold text-sm border border-dark-600 focus:border-brand-500 transition-colors box-border shadow-inner" 
                                    placeholder="-" 
                                    value={set.reps ?? ''} 
                                    onChange={(e) => updateSetLocal(i, 'reps', e.target.value)} 
                                    onBlur={handleSetBlur}
                                />

                                <input 
                                    type="text" 
                                    className="w-full bg-dark-800 rounded-xl py-2.5 text-brand-500 outline-none text-center font-bold text-sm border border-dark-600 focus:border-brand-500 transition-colors box-border shadow-inner" 
                                    placeholder="RIR" 
                                    value={set.rir ?? ''} 
                                    onChange={(e) => updateSetLocal(i, 'rir', e.target.value)} 
                                    onBlur={handleSetBlur}
                                />
                                
                                <button type="button" onClick={(e) => toggleDone(e, i)} className={`w-10 h-10 rounded-xl flex items-center justify-center transition-all box-border ${set.done ? 'bg-brand-500 text-white shadow-[0_0_15px_var(--brand-glow)] font-bold scale-105' : 'bg-dark-800 text-gray-500 border border-dark-600 hover:text-white'}`}>
                                    <i className="fa-solid fa-check"></i>
                                </button>
                            </div>
                        )
                    })}
                    <div className="flex gap-2 mt-4">
                        <button type="button" onClick={addSet} className="flex-1 bg-dark-800 text-brand-500 font-bold py-3.5 rounded-xl text-xs uppercase tracking-wider border border-dark-600 hover:bg-dark-700 transition-colors box-border shadow-md">
                            + Añadir {isUni ? 'I/D' : ''}
                        </button>
                        <button type="button" onClick={removeLastSet} className="flex-1 bg-dark-800 text-red-500 font-bold py-3.5 rounded-xl text-xs uppercase tracking-wider border border-dark-600 hover:bg-dark-700 transition-colors box-border shadow-md">
                            - Eliminar {isUni ? 'I/D' : ''}
                        </button>
                    </div>
                </div>
            );
        }

        function App() {
            const [isLicenseValid, setIsLicenseValid] = useState(true);
            const [globalData, setGlobalData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [view, setView] = useState('home');
            const [currentUser, setCurrentUser] = useState(null);
            const [pinInput, setPinInput] = useState('');
            const [newClientName, setNewClientName] = useState('');
            const [activeClient, setActiveClient] = useState(null);
            const [activeDayId, setActiveDayId] = useState(null);
            
            const [activeWeek, setActiveWeek] = useState(1); 
            const [isTrainingStarted, setIsTrainingStarted] = useState(false);
            const [trainingTime, setTrainingTime] = useState(0);
            
            const [restTime, setRestTime] = useState(0); 
            const [restTimerKey, setRestTimerKey] = useState(0); 
            
            const [catalogTarget, setCatalogTarget] = useState(null);
            const [transferTarget, setTransferTarget] = useState(null);

            const [toast, setToast] = useState(null);

            const saveTimeoutRef = useRef(null);
            const pendingDataRef = useRef(null);
            const isSavingRef = useRef(false);
            
            const showToast = (msg, type = 'info') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 3000);
            };

            const logout = () => {
                localStorage.removeItem(`bravo_session_${CLIENTE_ID}`);
                setCurrentUser(null);
                setView('home');
            };

            const mutateAndSave = (mutationCallback) => {
                isSavingRef.current = true;
                
                setGlobalData(prev => {
                    if (!prev) return prev;
                    const cloned = JSON.parse(JSON.stringify(prev));
                    mutationCallback(cloned);
                    pendingDataRef.current = cloned; 
                    return cloned;
                });

                if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
                
                saveTimeoutRef.current = setTimeout(async () => {
                    if (!pendingDataRef.current) return;
                    try {
                        await supabase.from('bravo_state').upsert({ id: CLIENTE_ID, data: pendingDataRef.current });
                    } catch (e) {
                        console.error("Error de sincronización con Supabase:", e);
                    } finally {
                        setTimeout(() => { isSavingRef.current = false; }, 1000);
                        saveTimeoutRef.current = null;
                    }
                }, 500); 
            };

            const updateAppSetting = (key, value) => {
                mutateAndSave((freshData) => {
                    freshData[key] = value;
                });
            };

            const handleProfileUpdate = (field, value) => {
                if (!currentUser) return;
                if (currentUser[field] === value) return;
                
                mutateAndSave((freshData) => {
                    const client = freshData.clients?.find(c => c.id === currentUser.id);
                    if (client) client[field] = value;
                });
                
                setCurrentUser(prev => ({ ...prev, [field]: value }));
                showToast('Métrica actualizada correctamente', 'info');
            };

            useEffect(() => {
                if (FECHA_VENCIMIENTO) {
                    const expiryDate = new Date(FECHA_VENCIMIENTO + 'T23:59:59');
                    const today = new Date();
                    if (today > expiryDate) {
                        setIsLicenseValid(false);
                    }
                }
            }, []);

            useEffect(() => {
                if (!isLicenseValid) {
                    setLoading(false);
                    return;
                }
                fetchData();
                const channel = supabase.channel(`realtime_${CLIENTE_ID}`).on('postgres_changes', { event: '*', schema: 'public', table: 'bravo_state' }, (payload) => {
                    if(payload && payload.new && payload.new.id === CLIENTE_ID) {
                        if (!isSavingRef.current) {
                            setGlobalData(payload.new.data);
                        }
                    }
                }).subscribe();
                return () => { supabase.removeChannel(channel); };
            }, [isLicenseValid]);

            useEffect(() => {
                let interval = null;
                if (view === 'cliente_entrenamiento' && isTrainingStarted) {
                    interval = setInterval(() => setTrainingTime(t => t + 1), 1000);
                } else { clearInterval(interval); }
                return () => clearInterval(interval);
            }, [view, isTrainingStarted]);

            useEffect(() => {
                let restInterval = null;
                if (restTime > 0) {
                    restInterval = setInterval(() => {
                        setRestTime(t => {
                            if (t <= 1) {
                                if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
                                playAlarm();
                                return 0;
                            }
                            return t - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(restInterval);
            }, [restTime > 0, restTimerKey]);

            // MANEJO DE HISTORY API PARA BLOQUEAR EL GESTO/BOTÓN DE ATRÁS EN ENTRENAMIENTO
            useEffect(() => {
                const handlePopState = (e) => {
                    if (view === 'cliente_entrenamiento' && isTrainingStarted) {
                        if (!window.confirm("¿Seguro que querés salir del entrenamiento en curso? Perderás el cronómetro.")) {
                            // Si cancela, volvemos a empujar el estado para mantener la trampa
                            window.history.pushState(null, '', window.location.href);
                        } else {
                            setIsTrainingStarted(false);
                            setView('cliente_listado');
                        }
                    }
                };
                window.addEventListener('popstate', handlePopState);
                return () => window.removeEventListener('popstate', handlePopState);
            }, [view, isTrainingStarted]);

            useEffect(() => {
                let wakeLock = null;
                const requestWakeLock = async () => {
                    try {
                        if ('wakeLock' in navigator) {
                            wakeLock = await navigator.wakeLock.request('screen');
                        }
                    } catch (err) {}
                };
                if (view === 'cliente_entrenamiento' && isTrainingStarted) {
                    requestWakeLock();
                }
                return () => { 
                    if (wakeLock) wakeLock.release().catch(()=>{}); 
                };
            }, [view, isTrainingStarted]);

            const startRest = (timeString) => {
                let t = 90;
                if (timeString) { 
                    let str = timeString.toString().toLowerCase().trim();
                    if (str.includes(':')) {
                        const parts = str.split(':');
                        t = (parseInt(parts[0]) || 0) * 60 + (parseInt(parts[1]) || 0);
                    } else if (str.includes('m')) {
                        const mMatch = str.match(/(\d+)\s*m/);
                        const sMatch = str.match(/(\d+)\s*s/);
                        const m = mMatch ? parseInt(mMatch[1]) : 0;
                        const s = sMatch ? parseInt(sMatch[1]) : 0;
                        t = m * 60 + s;
                    } else {
                        const parsed = parseInt(str.replace(/\D/g, ''));
                        if(!isNaN(parsed)) t = parsed;
                    }
                }
                setRestTime(t);
                setRestTimerKey(k => k + 1); 
            };

            const formatTime = (secs) => {
                const m = Math.floor(secs / 60).toString().padStart(2, '0');
                const s = (secs % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            };

            const getTonnageForWeek = (weekNum) => {
                if (!globalData || !currentUser || !globalData.progress) return 0;
                let total = 0;
                const weekData = globalData.progress[currentUser.id]?.[weekNum];
                if (!weekData) return 0;
                
                Object.values(weekData).forEach(ex => {
                    if (ex.sets) {
                        ex.sets.forEach(set => {
                            const w = parseFloat(set.weight?.toString().replace(',', '.') || 0);
                            const r = parseInt(set.reps || 0);
                            if (!isNaN(w) && !isNaN(r) && set.done) {
                                total += (w * r);
                            }
                        });
                    }
                });
                return total;
            };

            const fetchData = async () => {
                try {
                    const { data } = await supabase.from('bravo_state').select('data').eq('id', CLIENTE_ID).single();
                    let dbData = data?.data || { profesorPin: '0000', appTitle1: 'Entrenamiento', appTitle2: 'Y Salud', profesorName: '', clients: [], routines: {}, progress: {} };
                    setGlobalData(dbData);
                    
                    const savedSession = localStorage.getItem(`bravo_session_${CLIENTE_ID}`);
                    if (savedSession) {
                        try {
                            const parsed = JSON.parse(savedSession);
                            if (parsed.type === 'profesor' && parsed.pin === (dbData.profesorPin || '0000')) {
                                setView('profesor');
                            } else if (parsed.type === 'cliente') {
                                const client = dbData.clients?.find(c => c.id === parsed.id);
                                if (client) {
                                    setCurrentUser(client);
                                    setView('cliente_listado');
                                }
                            }
                        } catch (parseError) {
                            localStorage.removeItem(`bravo_session_${CLIENTE_ID}`);
                        }
                    }
                } catch (e) { 
                    console.error(e);
                    setGlobalData({ profesorPin: '0000', appTitle1: 'Entrenamiento', appTitle2: 'Y Salud', profesorName: '', clients: [], routines: {}, progress: {} });
                }
                setLoading(false);
            };

            const handleLogin = () => {
                if (!globalData) return;
                unlockAudio(); 
                
                if (pinInput === (globalData.profesorPin || '0000')) { 
                    localStorage.setItem(`bravo_session_${CLIENTE_ID}`, JSON.stringify({type: 'profesor', pin: pinInput}));
                    setView('profesor'); 
                } 
                else {
                    const client = globalData.clients?.find(c => c.pin === pinInput);
                    if (client) { 
                        localStorage.setItem(`bravo_session_${CLIENTE_ID}`, JSON.stringify({type: 'cliente', id: client.id}));
                        setCurrentUser(client); 
                        setView('cliente_listado'); 
                    } else { showToast('PIN incorrecto. Revisalo bien.', 'error'); }
                }
                setPinInput('');
            };

            const addClient = () => {
                if (!newClientName.trim()) return;

                if (MAX_CLIENTES !== null && (globalData.clients?.length || 0) >= MAX_CLIENTES) {
                    showToast(`Límite de licencia alcanzado (${MAX_CLIENTES} alumnos). Renovación requerida.`, 'error');
                    return;
                }

                const newPin = Math.floor(1000 + Math.random() * 9000).toString();
                const newClient = { id: Date.now().toString(36) + Math.random().toString(36).substr(2, 5), name: newClientName, pin: newPin };
                
                mutateAndSave((freshData) => {
                    if(!freshData.clients) freshData.clients = [];
                    if(!freshData.routines) freshData.routines = {};
                    if(!freshData.progress) freshData.progress = {};
                    freshData.clients.push(newClient);
                    freshData.routines[newClient.id] = [];
                });
                
                setNewClientName('');
                showToast(`¡Alumno creado! PIN: ${newPin}`);
            };

            const deleteClient = (clientId) => {
                if(window.confirm('¿Seguro que querés eliminar a este alumno y TODAS sus rutinas? Esta acción no se puede deshacer.')) {
                    mutateAndSave((freshData) => {
                        freshData.clients = freshData.clients.filter(c => c.id !== clientId);
                        if(freshData.routines) delete freshData.routines[clientId];
                        if(freshData.progress) delete freshData.progress[clientId];
                    });
                    setActiveClient(null);
                    showToast('Alumno eliminado correctamente.');
                }
            };

            const editClientName = (clientId, oldName) => {
                const newName = window.prompt('Nuevo nombre del alumno:', oldName);
                if(newName && newName.trim() !== '' && newName !== oldName) {
                    mutateAndSave((freshData) => {
                        const client = freshData.clients.find(c => c.id === clientId);
                        if(client) client.name = newName;
                    });
                    showToast('Nombre actualizado.');
                }
            };

            const addDay = (clientId) => {
                mutateAndSave((freshData) => {
                    if(!freshData.routines[clientId]) freshData.routines[clientId] = [];
                    freshData.routines[clientId].push({ 
                        id: Date.now().toString(36) + Math.random().toString(36).substr(2, 5), 
                        name: "Nueva Plantilla", 
                        sections: [ { id: Math.random().toString(36).substr(2, 9), name: 'Bloque Principal', exercises: [] } ] 
                    });
                });
            };

            const updateDayName = (clientId, dayId, newName) => {
                mutateAndSave((freshData) => {
                    const day = freshData.routines[clientId]?.find(d => d.id === dayId);
                    if(day) day.name = newName;
                });
            };

            const deleteDay = (clientId, dayId) => {
                const confirmacion = window.confirm('¿Seguro que querés borrar esta plantilla entera?');
                if (!confirmacion) return;
                
                mutateAndSave((freshData) => {
                    if(freshData.routines[clientId]) {
                        freshData.routines[clientId] = freshData.routines[clientId].filter(d => d.id !== dayId);
                    }
                });
                
                setActiveDayId(null);
                showToast('Plantilla eliminada');
            };

            const cloneDay = (clientId, dayId) => {
                mutateAndSave((freshData) => {
                    const dayToClone = freshData.routines[clientId]?.find(d => d.id === dayId);
                    if (!dayToClone) return;

                    const clonedSections = (dayToClone.sections || [{ name: 'Bloque Principal', exercises: dayToClone.exercises || [] }]).map(sec => ({
                        ...sec,
                        id: Math.random().toString(36).substr(2, 9),
                        exercises: (sec.exercises || []).map(ex => ({
                            ...ex,
                            id: Math.random().toString(36).substr(2, 9)
                        }))
                    }));

                    const newDay = {
                        id: Date.now().toString(36) + Math.random().toString(36).substr(2, 5),
                        name: dayToClone.name + " (Copia)",
                        sections: clonedSections
                    };

                    freshData.routines[clientId].push(newDay);
                });
                showToast('Plantilla duplicada con éxito');
            };

            const transferDayToClient = (sourceClientId, targetClientId, dayId) => {
                mutateAndSave((freshData) => {
                    const dayToClone = freshData.routines[sourceClientId]?.find(d => d.id === dayId);
                    if (!dayToClone) return;

                    const clonedSections = (dayToClone.sections || [{ name: 'Bloque Principal', exercises: dayToClone.exercises || [] }]).map(sec => ({
                        ...sec,
                        id: Math.random().toString(36).substr(2, 9),
                        exercises: (sec.exercises || []).map(ex => ({
                            ...ex,
                            id: Math.random().toString(36).substr(2, 9)
                        }))
                    }));

                    const newDay = {
                        id: Date.now().toString(36) + Math.random().toString(36).substr(2, 5),
                        name: dayToClone.name,
                        sections: clonedSections
                    };

                    if (!freshData.routines[targetClientId]) freshData.routines[targetClientId] = [];
                    freshData.routines[targetClientId].push(newDay);
                });
                const targetClient = globalData.clients.find(c => c.id === targetClientId);
                showToast(`Plantilla asignada a ${targetClient?.name}`, 'info');
            };

            const addSection = (clientId, dayId) => {
                mutateAndSave((freshData) => {
                    const day = freshData.routines[clientId]?.find(d => d.id === dayId);
                    if(!day) return;
                    if(!day.sections) {
                        day.sections = [{ id: 'default', name: 'Bloque Principal', exercises: day.exercises || [] }];
                        delete day.exercises;
                    }
                    day.sections.push({ id: Math.random().toString(36).substr(2, 9), name: 'Nuevo Bloque', exercises: [] });
                });
            };

            const updateSectionName = (clientId, dayId, secId, newName) => {
                mutateAndSave((freshData) => {
                    const day = freshData.routines[clientId]?.find(d => d.id === dayId);
                    if (!day) return;
                    if (!day.sections) {
                        day.sections = [{ id: 'default', name: newName, exercises: day.exercises || [] }];
                        delete day.exercises;
                    } else {
                        const sec = day.sections.find(s => s.id === secId) || day.sections[0];
                        if(sec) sec.name = newName;
                    }
                });
            };

            const deleteSection = (clientId, dayId, secId) => {
                mutateAndSave((freshData) => {
                    const day = freshData.routines[clientId]?.find(d => d.id === dayId);
                    if (!day || !day.sections) return;
                    
                    day.sections = day.sections.filter(s => s.id !== secId);
                    if(day.sections.length === 0) {
                        day.sections.push({ id: Math.random().toString(36).substr(2, 9), name: 'Bloque Principal', exercises: [] });
                    }
                });
            };

            const handleExerciseSelected = (exerciseName) => {
                if (!catalogTarget) return;
                
                const catInfo = EXERCISE_CATALOG.find(e => e.name === exerciseName);
                const imageUrl = catInfo ? catInfo.image : null;
                const description = catInfo ? catInfo.description : '';
                const muscle = catInfo ? catInfo.muscle : '';
                const equip = catInfo ? catInfo.equip : '';

                const { clientId, dayId, secId } = catalogTarget;
                
                mutateAndSave((freshData) => {
                    const day = freshData.routines[clientId]?.find(d => d.id === dayId);
                    if (!day) return;
                    
                    if (!day.sections) {
                        day.sections = [{ id: 'default', name: 'Bloque Principal', exercises: day.exercises || [] }];
                        delete day.exercises;
                    }
                    
                    const sec = day.sections.find(s => s.id === secId) || day.sections[0];
                    if (sec && sec.exercises) {
                        sec.exercises.push({ 
                            id: Math.random().toString(36).substr(2, 9), 
                            name: exerciseName,
                            image: imageUrl, 
                            description: description,
                            muscle: muscle,
                            equip: equip,
                            link: '',
                            sets: '4', reps: '10', rir: '2', rest: '90s', isUnilateral: false, weeks: {} 
                        });
                    } else if (sec) {
                        sec.exercises = [{
                            id: Math.random().toString(36).substr(2, 9), 
                            name: exerciseName,
                            image: imageUrl, 
                            description: description,
                            muscle: muscle,
                            equip: equip,
                            link: '',
                            sets: '4', reps: '10', rir: '2', rest: '90s', isUnilateral: false, weeks: {} 
                        }];
                    }
                });
                setCatalogTarget(null);
            };

            const updateExerciseInSection = (clientId, dayId, secId, updatedExercise) => {
                mutateAndSave((freshData) => {
                    const day = freshData.routines[clientId]?.find(d => d.id === dayId);
                    if (!day) return;

                    if (!day.sections) {
                        day.sections = [{ id: 'default', name: 'Bloque Principal', exercises: day.exercises || [] }];
                        delete day.exercises;
                    }

                    const sec = day.sections.find(s => s.id === secId) || day.sections[0];
                    if (!sec || !sec.exercises) return;
                    
                    const index = sec.exercises.findIndex(e => e.id === updatedExercise.id);
                    if(index !== -1) sec.exercises[index] = updatedExercise;
                });
            };

            const deleteExerciseFromSection = (clientId, dayId, secId, exerciseId) => {
                mutateAndSave((freshData) => {
                    const day = freshData.routines[clientId]?.find(d => d.id === dayId);
                    if (!day) return;

                    if (!day.sections) {
                        day.sections = [{ id: 'default', name: 'Bloque Principal', exercises: day.exercises || [] }];
                        delete day.exercises;
                    }

                    const sec = day.sections.find(s => s.id === secId) || day.sections[0];
                    if(sec && sec.exercises) {
                        sec.exercises = sec.exercises.filter(e => e.id !== exerciseId);
                    }
                });
            };

            const moveExercise = (clientId, dayId, secId, exerciseIndex, direction) => {
                mutateAndSave((freshData) => {
                    const day = freshData.routines[clientId]?.find(d => d.id === dayId);
                    if (!day) return;

                    if (!day.sections) {
                        day.sections = [{ id: 'default', name: 'Bloque Principal', exercises: day.exercises || [] }];
                        delete day.exercises;
                    }

                    const sec = day.sections.find(s => s.id === secId) || day.sections[0];
                    if(!sec || !sec.exercises) return;

                    const newIndex = exerciseIndex + direction;
                    if(newIndex < 0 || newIndex >= sec.exercises.length) return;

                    const temp = sec.exercises[exerciseIndex];
                    sec.exercises[exerciseIndex] = sec.exercises[newIndex];
                    sec.exercises[newIndex] = temp;
                });
            };

            const saveClientProgress = (exerciseId, setsArray, noteString, week) => {
                mutateAndSave((freshData) => {
                    if (!freshData.progress) freshData.progress = {};
                    if (!freshData.progress[currentUser.id]) freshData.progress[currentUser.id] = {};
                    if (!freshData.progress[currentUser.id][week]) freshData.progress[currentUser.id][week] = {};
                    if (!freshData.progress[currentUser.id][week][exerciseId]) freshData.progress[currentUser.id][week][exerciseId] = {};
                    
                    if (setsArray) freshData.progress[currentUser.id][week][exerciseId].sets = setsArray;
                    if (noteString !== undefined) freshData.progress[currentUser.id][week][exerciseId].note = noteString;
                });
            };

            // Cálculo dinámico del tema
            const currentTheme = THEMES[globalData?.themeColor] || THEMES.green;
            const appStyleVars = {
                '--brand-500': currentTheme[500],
                '--brand-600': currentTheme[600],
                '--brand-glow': currentTheme.glow,
                '--brand-glow-strong': currentTheme.glowStrong,
            };

            if (!isLicenseValid) {
                return (
                    <div className="app-container flex flex-col justify-center items-center h-screen bg-dark-900 p-8 text-center relative" style={appStyleVars}>
                        <div className="bg-watermark text-red-500/10" style={{transform: 'rotate(-15deg)', fontSize: '200px'}}><i className="fa-solid fa-lock"></i></div>
                        <div className="w-24 h-24 bg-red-500/10 rounded-full flex items-center justify-center mb-6 border border-red-500/30 relative z-10 shadow-[0_0_40px_rgba(239,68,68,0.3)]">
                            <i className="fa-solid fa-lock text-4xl text-red-500"></i>
                        </div>
                        <h1 className="text-2xl font-black text-white uppercase tracking-wider mb-3 relative z-10">Licencia Expirada</h1>
                        <p className="text-sm text-gray-400 leading-relaxed relative z-10 px-4">El período de uso de este panel ha finalizado. Comunicate con el proveedor del software para renovar tu acceso.</p>
                    </div>
                );
            }

            if (loading) return <div className="app-container flex justify-center items-center h-screen bg-dark-900 text-brand-500 text-2xl font-bold" style={appStyleVars}><i className="fa-solid fa-fire fa-spin mr-3"></i> Cargando...</div>;

            return (
                <div className="relative" style={appStyleVars}>
                    {view !== 'home' && <div className="bg-watermark"><i className="fa-solid fa-dumbbell"></i></div>}

                    {catalogTarget && (
                        <ExerciseCatalogModal 
                            onClose={() => setCatalogTarget(null)} 
                            onSelect={handleExerciseSelected} 
                        />
                    )}

                    {transferTarget && (
                        <div className="fixed inset-0 z-[200] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in" onClick={() => setTransferTarget(null)}>
                            <div className="bg-dark-900 border border-brand-500/30 p-6 rounded-3xl w-full max-w-sm shadow-2xl relative" onClick={e => e.stopPropagation()}>
                                <h3 className="text-white font-bold text-lg mb-4 flex items-center gap-2"><i className="fa-solid fa-share-nodes text-brand-500"></i> Transferir plantilla a...</h3>
                                <div className="space-y-2 max-h-60 overflow-y-auto hide-scrollbar">
                                    {globalData.clients.filter(c => c.id !== transferTarget.sourceClientId).map(c => (
                                        <button key={c.id} onClick={() => { transferDayToClient(transferTarget.sourceClientId, c.id, transferTarget.dayId); setTransferTarget(null); }} className="w-full text-left bg-dark-800 p-4 rounded-xl border border-white/5 hover:border-brand-500 text-white font-medium transition-colors flex items-center justify-between group">
                                            {c.name} <i className="fa-solid fa-arrow-right text-gray-500 group-hover:text-brand-500"></i>
                                        </button>
                                    ))}
                                    {globalData.clients.length <= 1 && <p className="text-gray-500 text-sm text-center py-4">No hay otros alumnos creados en tu panel.</p>}
                                </div>
                                <button onClick={() => setTransferTarget(null)} className="w-full mt-4 bg-dark-800 text-gray-400 font-bold py-3.5 rounded-xl border border-dark-600 hover:text-white transition-colors">Cancelar</button>
                            </div>
                        </div>
                    )}

                    {toast && (
                        <div className={`fixed top-6 left-1/2 transform -translate-x-1/2 z-50 px-6 py-3 rounded-2xl text-sm font-bold shadow-2xl animate-toast-down text-center flex items-center gap-3 whitespace-nowrap ${toast.type === 'error' ? 'bg-red-600 text-white' : 'bg-brand-500 text-white shadow-brand-500/40'}`}>
                            {toast.type === 'error' ? <i className="fa-solid fa-triangle-exclamation"></i> : <i className="fa-solid fa-bolt"></i>}
                            {toast.msg}
                        </div>
                    )}

                    {view === 'home' && (
                        <div 
                            className="app-container flex flex-col justify-between p-6 h-screen relative z-10"
                            style={{ 
                                backgroundImage: 'linear-gradient(to bottom, rgba(10,10,12,0.3) 0%, rgba(5,5,7,0.95) 100%), url("https://images.unsplash.com/photo-1540497077202-7c8a3999166f?q=80&w=800&auto=format&fit=crop")', 
                                backgroundSize: 'cover', 
                                backgroundPosition: 'center' 
                            }}
                        >
                            <div className="text-center animate-fade-in my-auto relative z-20 mt-20">
                                <div className="inline-flex justify-center items-center w-28 h-28 bg-gradient-to-br from-dark-800 to-dark-950 rounded-[2rem] border-2 border-brand-500/40 text-brand-500 mb-8 shadow-[0_0_40px_var(--brand-glow)] relative overflow-hidden transform rotate-3">
                                    <div className="absolute inset-0 bg-brand-500/10 backdrop-blur-md"></div>
                                    <i className="fa-solid fa-dumbbell text-5xl relative z-10 drop-shadow-[0_0_15px_var(--brand-glow-strong)] -rotate-3"></i>
                                </div>
                                
                                <h1 className="text-4xl font-black text-white uppercase tracking-tighter mb-0.5 drop-shadow-lg">{globalData?.appTitle1 || 'Entrenamiento'}</h1>
                                <h2 className="text-xl font-bold text-brand-500 tracking-[0.2em] uppercase drop-shadow-md">{globalData?.appTitle2 || 'Y Salud'}</h2>
                                <p className="text-[10px] text-gray-300 font-black tracking-widest mt-4 uppercase border-t border-white/20 pt-4 mx-auto w-3/4 opacity-90">Rendimiento & Biomecánica</p>
                            </div>
                            
                            <div className="glass-panel p-6 rounded-[2rem] shadow-2xl mb-6 relative z-20">
                                <input 
                                    type="password" 
                                    placeholder="INGRESA TU PIN" 
                                    className="w-full bg-dark-950/50 p-4 rounded-2xl text-center text-xl tracking-[0.4em] outline-none mb-4 text-white border border-white/10 focus:border-brand-500 transition-colors font-bold placeholder:tracking-normal placeholder:font-normal placeholder:text-gray-400 shadow-inner backdrop-blur-sm" 
                                    value={pinInput} 
                                    onChange={(e) => setPinInput(e.target.value)} 
                                />
                                <button onClick={handleLogin} className="w-full bg-gradient-to-r from-brand-500 to-brand-600 text-white py-4 rounded-2xl font-black text-sm hover:from-brand-600 hover:to-brand-700 transition-all shadow-lg shadow-brand-500/40 uppercase tracking-widest">
                                    Ingresar
                                </button>
                            </div>
                        </div>
                    )}

                    {view === 'profesor' && (
                        <div className="app-container pb-20 relative z-10 bg-dark-900">
                            {activeClient ? (
                                activeDayId && globalData.routines[activeClient.id]?.find(d => d.id === activeDayId) ? (
                                    <>
                                        <header className="p-4 flex items-center justify-between sticky top-0 glass-header z-50">
                                            <button onClick={() => setActiveDayId(null)} className="text-brand-500 w-10 h-10 flex items-center justify-center hover:text-white transition-colors bg-dark-800 rounded-xl border border-white/5"><i className="fa-solid fa-arrow-left text-base"></i></button>
                                            <h2 className="font-bold text-base text-white tracking-wide">Editar Plantilla</h2>
                                            <div className="w-10"></div>
                                        </header>
                                        <div className="p-4">
                                            <EditableTitle 
                                                initialValue={globalData.routines[activeClient.id].find(d => d.id === activeDayId).name}
                                                placeholder="Nombre del día..."
                                                className="font-black text-2xl lowercase bg-transparent outline-none text-white w-full mb-6 border-b border-dark-700 pb-2 focus:border-brand-500 transition-colors placeholder-gray-600"
                                                onSave={(val) => updateDayName(activeClient.id, activeDayId, val)}
                                            />
                                            
                                            {(() => {
                                                const day = globalData.routines[activeClient.id].find(d => d.id === activeDayId);
                                                const sections = day.sections || [{ id: 'default', name: 'Bloque Principal', exercises: day.exercises || [] }];

                                                return (
                                                    <div className="space-y-6">
                                                        {sections.map((sec, secIdx) => (
                                                            <div key={sec.id || secIdx} className="bg-dark-800/80 backdrop-blur-md p-4 rounded-3xl border border-white/5 shadow-xl">
                                                                <div className="flex items-center justify-between mb-4 pb-2 border-b border-dark-700">
                                                                    <EditableTitle 
                                                                        initialValue={sec.name}
                                                                        placeholder="NOMBRE DEL BLOQUE..."
                                                                        className="bg-transparent font-black text-brand-500 text-sm uppercase tracking-wider outline-none w-3/4 placeholder-gray-500"
                                                                        onSave={(val) => updateSectionName(activeClient.id, activeDayId, sec.id, val)}
                                                                    />
                                                                    {sections.length > 1 && (
                                                                        <button onClick={() => deleteSection(activeClient.id, activeDayId, sec.id)} className="text-gray-500 hover:text-red-400 transition-colors text-xs px-2 py-1"><i className="fa-solid fa-trash-can"></i></button>
                                                                    )}
                                                                </div>

                                                                {sec.exercises.map((ex, exIdx) => (
                                                                    <ExerciseRow 
                                                                        key={ex.id} 
                                                                        exercise={ex}
                                                                        isFirst={exIdx === 0}
                                                                        isLast={exIdx === sec.exercises.length - 1}
                                                                        clientProgress={globalData.progress?.[activeClient.id]}
                                                                        onUpdate={(u) => updateExerciseInSection(activeClient.id, activeDayId, sec.id, u)} 
                                                                        onDelete={() => deleteExerciseFromSection(activeClient.id, activeDayId, sec.id, ex.id)} 
                                                                        onMoveUp={() => moveExercise(activeClient.id, activeDayId, sec.id, exIdx, -1)}
                                                                        onMoveDown={() => moveExercise(activeClient.id, activeDayId, sec.id, exIdx, 1)}
                                                                    />
                                                                ))}

                                                                <button onClick={() => setCatalogTarget({clientId: activeClient.id, dayId: activeDayId, secId: sec.id})} className="w-full bg-dark-700 text-brand-500 font-bold py-3.5 rounded-2xl mt-2 text-xs uppercase tracking-wider border border-white/5 hover:bg-dark-600 transition-colors shadow-sm flex items-center justify-center gap-2">
                                                                    <i className="fa-solid fa-magnifying-glass"></i> Añadir desde catálogo
                                                                </button>
                                                            </div>
                                                        ))}

                                                        <button onClick={() => addSection(activeClient.id, activeDayId)} className="w-full bg-dark-800 text-white font-bold py-4 rounded-2xl mt-4 border border-white/5 hover:bg-dark-700 transition-colors shadow-lg flex items-center justify-center gap-2 text-sm uppercase tracking-wide">
                                                            <i className="fa-solid fa-layer-group text-brand-500"></i> Nuevo bloque
                                                        </button>
                                                    </div>
                                                );
                                            })()}
                                        </div>
                                    </>
                                ) : (
                                    <>
                                        <header className="p-4 flex items-center justify-between sticky top-0 glass-header z-10">
                                            <button onClick={() => setActiveClient(null)} className="text-brand-500 w-10 h-10 flex items-center justify-center hover:text-white transition-colors bg-dark-800 rounded-xl border border-white/5"><i className="fa-solid fa-arrow-left text-base"></i></button>
                                            <div className="flex flex-col items-center">
                                                <h2 className="font-bold text-base text-white tracking-wide">{activeClient.name}</h2>
                                                {(activeClient.age || activeClient.weight || activeClient.goal) && (
                                                    <p className="text-[9px] text-brand-500 font-black mt-0.5 uppercase tracking-widest">
                                                        {[
                                                            activeClient.age ? `${activeClient.age}A` : null, 
                                                            activeClient.weight ? `${activeClient.weight}KG` : null, 
                                                            activeClient.goal
                                                        ].filter(Boolean).join(' • ')}
                                                    </p>
                                                )}
                                            </div>
                                            <div className="w-10"></div>
                                        </header>
                                        
                                        <div className="p-4">
                                            <h3 className="font-black text-xs text-gray-400 uppercase tracking-widest mb-4">Plantillas asignadas</h3>
                                            <div className="space-y-4">
                                                {(globalData.routines[activeClient.id] || []).map(day => {
                                                    const totalEx = day.sections ? day.sections.reduce((acc, s) => acc + (s.exercises?.length || 0), 0) : (day.exercises?.length || 0);
                                                    return (
                                                        <div key={day.id} onClick={() => setActiveDayId(day.id)} className="glass-panel p-4 rounded-2xl flex items-center gap-4 cursor-pointer hover:border-brand-500/50 transition-all shadow-md group border border-white/5">
                                                            <div className="w-14 h-14 bg-dark-800 rounded-xl shrink-0 flex items-center justify-center text-brand-500 border border-dark-600 group-hover:scale-105 transition-transform">
                                                                <i className="fa-solid fa-dumbbell text-xl"></i>
                                                            </div>
                                                            <div className="flex-1 overflow-hidden">
                                                                <h4 className="font-bold text-base text-white truncate lowercase">{day.name}</h4>
                                                                <p className="text-xs text-gray-400 truncate mt-0.5">{totalEx} ejercicios programados</p>
