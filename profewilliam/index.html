    <script>
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'panel-pro-offline-v1';
                self.addEventListener('install', (e) => { self.skipWaiting(); });
                self.addEventListener('fetch', (e) => {
                    if (e.request.method !== 'GET') return;
                    e.respondWith(
                        fetch(e.request).then((response) => {
                            const clone = response.clone();
                            caches.open(CACHE_NAME).then((cache) => cache.put(e.request, clone));
                            return response;
                        }).catch(() => caches.match(e.request))
                    );
                });
            `;
            const blob = new Blob([swCode], {type: 'application/javascript'});
            const swUrl = URL.createObjectURL(blob);
            window.addEventListener('load', () => {
                navigator.serviceWorker.register(swUrl).catch(() => {});
            });
        }

        tailwind.config = {
            theme: {

        let audioCtx = null;
        const unlockAudio = () => {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        };

        document.addEventListener('touchstart', unlockAudio, { once: true });
        document.addEventListener('click', unlockAudio, { once: true });

        const playAlarm = () => {
            try {
                if (!audioCtx) unlockAudio();
                if (!audioCtx) return;
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); 
                oscillator.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.2); 
                gainNode.gain.setValueAtTime(1, audioCtx.currentTime); 
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.6); 
            } catch(e) {}
        };

                setLocalEx(updated);
                localExRef.current = updated;

                updateLocalAndRef({ ...localEx, [field]: value });
            };

            const handleWeekConfigChange = (weekNum, field, value) => {

                    updatedWeeks[weekNum] = { sets: localEx.sets ?? '4', reps: localEx.reps ?? '10' };
                }
                updatedWeeks[weekNum][field] = value;
                updateLocalAndRef({ ...localEx, weeks: updatedWeeks });
            };
            
            const handleBlur = () => { onUpdate(localExRef.current); };

            const currentWeekData = localEx.weeks?.[editWeek] || { sets: localEx.sets ?? '4', reps: localEx.reps ?? '10' };

            const exerciseNotes = [];
            if (clientProgress) {
                [1,2,3,4].forEach(w => {
                    const note = clientProgress[w]?.[localEx.id]?.note;

            return (
                <div className="glass-panel p-4 rounded-2xl mb-4 relative z-10 shadow-xl border border-white/5">

                    )}

                    <div className="flex justify-between items-start mb-3 relative">
                        <div className="w-2/3 relative flex items-center">
                            <input 
                                className="bg-transparent font-bold text-lg outline-none w-full text-white placeholder-gray-500 tracking-wide" 
                                value={localEx.name ?? ''} onChange={(e) => handleChange('name', e.target.value)} 
                                onBlur={handleBlur} placeholder="Nombre del ejercicio"

                        </div>
                        <div className="flex items-center gap-1">

                            {!isLast && <button type="button" onClick={(e) => { e.stopPropagation(); onMoveDown(); }} className="text-gray-400 hover:text-white transition-colors px-1.5 py-1"><i className="fa-solid fa-arrow-down"></i></button>}
                            <button type="button" onClick={(e) => { e.stopPropagation(); setShowInfoModal(true); }} className="text-brand-500 hover:text-white transition-colors px-1.5 py-1"><i className="fa-solid fa-circle-info text-lg"></i></button>
                            <button type="button" onClick={(e) => { e.stopPropagation(); onDelete(); }} className="text-gray-500 hover:text-red-400 transition-colors px-1.5 py-1"><i className="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>

                    <div className="mb-3 pt-1">
                        <div className="flex items-center justify-between mb-2">
                            <span className="text-[10px] font-black text-brand-500 uppercase tracking-widest">Programación Semanal:</span>
                            <div className="flex bg-dark-900 rounded-lg p-0.5 border border-dark-600">
                                {[1, 2, 3, 4].map(w => (
                                    <button key={w} type="button" onClick={() => setEditWeek(w)} className={`px-3 py-1 text-xs font-bold rounded-md transition-all ${editWeek === w ? 'bg-brand-500 text-white shadow-md' : 'text-gray-400 hover:text-white'}`}>S{w}</button>
                                ))}

                        <div className="flex gap-4 text-sm text-gray-300 items-center bg-dark-900/60 p-3 rounded-xl border border-dark-600">

                                <span className="text-xs text-gray-400">Series:</span>

                        </div>
                        <div className="flex items-center gap-1.5">
                            <i className="fa-regular fa-clock text-brand-500"></i> <input className="w-14 bg-dark-900 rounded-lg p-1.5 text-center text-white font-bold outline-none border border-dark-600 focus:border-brand-500 text-xs" value={localEx.rest ?? '90s'} onChange={(e) => handleChange('rest', e.target.value)} onBlur={handleBlur} placeholder="90s" />

                            rows="2" placeholder="Notas rápidas..." value={localEx.coachNote ?? ''}
                            onChange={(e) => handleChange('coachNote', e.target.value)} onBlur={handleBlur}
                        />
                    </div>
                </div>
            );
        }

        function ClientExerciseRow({ exercise, activeWeek, progressData, previousWeekData, allWeeksData, onSaveProgress, onStartRest, showToast }) {
            const weekConfig = exercise.weeks?.[activeWeek] || { sets: exercise.sets || '4', reps: exercise.reps || '10' };
            const baseSetsCount = parseInt(weekConfig.sets) || 1;
            const isUni = exercise.isUnilateral === true;
            const totalRows = isUni ? baseSetsCount * 2 : baseSetsCount;

            const [showNotes, setShowNotes] = useState(false);
            const [showHistory, setShowHistory] = useState(false);
            const [showInfoModal, setShowInfoModal] = useState(false);
            
            const [localNote, setLocalNote] = useState(progressData?.note ?? '');
            const [localSets, setLocalSets] = useState([]);

            const localSetsRef = useRef(localSets);
            const localNoteRef = useRef(localNote);

            const commitSets = (newSets) => {
                localSetsRef.current = newSets;
                setLocalSets(newSets);
                onSaveProgress(newSets, localNoteRef.current);
            };

            useEffect(() => {
                const saved = progressData?.sets || [];
                let newSets = [...saved];
                if (newSets.length < totalRows) {
                    for (let i = newSets.length; i < totalRows; i++) {
                        newSets.push({ weight: '', reps: '', rir: '', done: false, type: 'N' });
                    }
                } 
                setLocalSets(newSets);
                localSetsRef.current = newSets;
                setLocalNote(progressData?.note ?? '');
                localNoteRef.current = progressData?.note ?? '';
            }, [progressData, totalRows, activeWeek]);

            const updateSetLocal = (index, field, value) => {
                const newSets = [...localSetsRef.current];
                newSets[index] = { ...newSets[index], [field]: value };
                localSetsRef.current = newSets;
                setLocalSets(newSets);
            };

            const handleSetBlur = () => { onSaveProgress(localSetsRef.current, localNoteRef.current); };

            const toggleDone = (e, index) => {
                e.preventDefault(); e.stopPropagation();
                unlockAudio();
                const newSets = [...localSetsRef.current];
                const wasDone = newSets[index].done;
                newSets[index] = { ...newSets[index], done: !wasDone };
                commitSets(newSets);
                if (!wasDone) onStartRest(exercise.rest || '90s');
            };

            const addSet = () => {
                const addCount = isUni ? 2 : 1;
                const newSets = [...localSetsRef.current];
                for(let i=0; i<addCount; i++){
                    newSets.push({ weight: '', reps: '', rir: '', done: false, type: 'N' });
                }
                commitSets(newSets);
            };

            const cycleSetType = (e, index) => {
                e.preventDefault(); e.stopPropagation();
                const types = ['N', 'W', 'D'];
                const current = localSetsRef.current[index].type || 'N';
                const next = types[(types.indexOf(current) + 1) % types.length];
                const newSets = [...localSetsRef.current];
                newSets[index] = { ...newSets[index], type: next };
                commitSets(newSets);
            };

            const adjustWeight = (e, index, amount) => {
                e.preventDefault(); e.stopPropagation();
                let currentStr = localSetsRef.current[index].weight || '';
                currentStr = currentStr.toString().replace(',', '.');
                let currentVal = parseFloat(currentStr);
                if (isNaN(currentVal)) currentVal = 0;
                let newVal = Math.max(0, currentVal + amount);
                let finalStr = newVal === 0 ? '' : newVal.toString();
                const newSets = [...localSetsRef.current];
                newSets[index] = { ...newSets[index], weight: finalStr };
                commitSets(newSets);
            };

            return (
                <div className="mb-10 relative z-10">
                    {showInfoModal && <ExerciseInfoModal exercise={exercise} isTeacher={false} onClose={() => setShowInfoModal(false)} />}

                    <div className="flex items-center justify-between mb-4">
                        <div className="flex items-center gap-3">
                            <div className="w-11 h-11 bg-dark-700 rounded-2xl flex items-center justify-center text-brand-500 shadow-lg border border-white/5 overflow-hidden">
                                {exercise.image ? <img src={exercise.image} alt={exercise.name} className="w-full h-full object-cover" /> : <i className="fa-solid fa-dumbbell text-lg"></i>}
                            </div>
                            <div>
                                <h4 onClick={() => setShowInfoModal(true)} className="font-bold text-base text-white leading-tight tracking-wide cursor-pointer hover:text-brand-500 flex items-center gap-1.5 transition-colors group">
                                    {exercise.name} <i className="fa-solid fa-circle-info text-xs text-brand-500 opacity-60"></i>
                                </h4>
                                <span className="text-xs text-brand-500 font-semibold">Sem. {activeWeek} • Pauta: {weekConfig.sets} x {weekConfig.reps}</span>
                            </div>
                        </div>
                    </div>

                    <div className="flex gap-2 mb-4">
                        <button onClick={() => {setShowHistory(!showHistory); setShowNotes(false);}} className={`text-xs font-bold px-4 py-2 rounded-xl flex items-center gap-2 border ${showHistory ? 'bg-brand-500 text-white border-brand-500' : 'bg-dark-800 text-gray-300 border-dark-600'}`}>
                            <i className="fa-solid fa-clock-rotate-left"></i> Historial
                        </button>
                        <button onClick={() => {setShowNotes(!showNotes); setShowHistory(false);}} className={`text-xs font-bold px-4 py-2 rounded-xl flex items-center gap-2 border ${showNotes ? 'bg-brand-500 text-white border-brand-500' : 'bg-dark-800 text-gray-300 border-dark-600'}`}>
                            <i className="fa-solid fa-pencil"></i> Notas
                        </button>
                    </div>

                    {showNotes && (
                        <div className="mb-4 animate-fade-in w-full">
                            <textarea 
                                value={localNote} onChange={(e) => { localNoteRef.current = e.target.value; setLocalNote(e.target.value); }} 
                                onBlur={handleSetBlur} placeholder="Anotá acá tus sensaciones..." 
                                className="w-full bg-dark-800 text-white p-3 rounded-xl outline-none border border-dark-600 focus:border-brand-500 text-sm resize-none h-24"
                            />
                        </div>
                    )}

                    <div className="grid grid-cols-[36px_55px_1fr_70px_50px_42px] gap-1 mb-2 text-[10px] text-gray-400 font-black uppercase tracking-widest px-1 text-center items-center">
                        <span>Set</span><span>Previa</span><span>KG (±2.5)</span><span>Reps</span><span>RIR</span><span></span>
                    </div>
                    
                    {localSets.map((set, i) => {
                        const prevSet = previousWeekData?.sets?.[i];
                        const prevText = prevSet?.weight && prevSet?.reps ? `${prevSet.weight}x${prevSet.reps}` : '-';
                        const isRight = isUni && (i % 2 !== 0);
                        const setNum = isUni ? Math.floor(i / 2) + 1 : i + 1;
                        const setType = set.type || 'N';
                        let badgeText = setType === 'N' ? setNum : setType;
                        if (isUni) badgeText = `${badgeText}${isRight ? 'D' : 'I'}`;

                        let badgeStyle = "bg-dark-800 text-gray-400 border-dark-600";
                        if (setType === 'W') badgeStyle = "bg-orange-950/60 text-orange-400 border-orange-800";
                        else if (setType === 'D') badgeStyle = "bg-red-950/60 text-red-400 border-red-800";

                        return (
                            <div key={i} className="grid grid-cols-[36px_55px_1fr_70px_50px_42px] gap-1 items-center mb-2.5">
                                <button type="button" onClick={(e) => cycleSetType(e, i)} className={`w-9 h-10 flex items-center justify-center rounded-xl font-black text-xs border ${badgeStyle}`}>
                                    {badgeText}
                                </button>
                                <div className="text-center text-gray-500 text-xs font-semibold truncate">{prevText}</div>
                                <div className="flex items-center bg-dark-800 rounded-xl border border-dark-600 focus-within:border-brand-500 overflow-hidden shadow-inner w-full">
                                    <button type="button" onClick={(e) => adjustWeight(e, i, -2.5)} className="w-7 h-10 text-gray-400 hover:text-white font-bold flex items-center justify-center">-</button>
                                    <input 
                                        type="text" inputMode="decimal" className="w-full bg-transparent py-2.5 text-white outline-none text-center font-bold text-sm" 
                                        placeholder="-" value={set.weight ?? ''} onChange={(e) => updateSetLocal(i, 'weight', e.target.value)} onBlur={handleSetBlur}
                                    />
                                    <button type="button" onClick={(e) => adjustWeight(e, i, 2.5)} className="w-7 h-10 text-gray-400 hover:text-white font-bold flex items-center justify-center">+</button>
                                </div>
                                <input 
                                    type="text" className="w-full bg-dark-800 rounded-xl py-2.5 text-white outline-none text-center font-bold text-sm border border-dark-600" 
                                    placeholder="-" value={set.reps ?? ''} onChange={(e) => updateSetLocal(i, 'reps', e.target.value)} onBlur={handleSetBlur}
                                />
                                <input 
                                    type="text" className="w-full bg-dark-800 rounded-xl py-2.5 text-brand-500 outline-none text-center font-bold text-sm border border-dark-600" 
                                    placeholder="RIR" value={set.rir ?? ''} onChange={(e) => updateSetLocal(i, 'rir', e.target.value)} onBlur={handleSetBlur}
                                />
                                <button type="button" onClick={(e) => toggleDone(e, i)} className={`w-10 h-10 rounded-xl flex items-center justify-center ${set.done ? 'bg-brand-500 text-white shadow-brand-500/50 font-bold scale-105' : 'bg-dark-800 text-gray-500 border border-dark-600'}`}>
                                    <i className="fa-solid fa-check"></i>
                                </button>
                            </div>
                        )
                    })}
                    <button type="button" onClick={addSet} className="w-full mt-4 bg-dark-800 text-brand-500 font-bold py-3.5 rounded-xl text-xs uppercase tracking-wider border border-dark-600 shadow-md">
                        + Añadir serie
                    </button>
                </div>
            );
        }

        function App() {
            const [globalData, setGlobalData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [view, setView] = useState('landing'); 
            const [currentUser, setCurrentUser] = useState(null);
            const [pinInput, setPinInput] = useState('');
            const [newClientName, setNewClientName] = useState('');
            const [activeClient, setActiveClient] = useState(null);
            const [activeDayId, setActiveDayId] = useState(null);
            const [activeWeek, setActiveWeek] = useState(1); 
            const [isTrainingStarted, setIsTrainingStarted] = useState(false);
            const [trainingTime, setTrainingTime] = useState(0);
            const [restTime, setRestTime] = useState(0); 
            const [catalogTarget, setCatalogTarget] = useState(null);
            const [transferTarget, setTransferTarget] = useState(null);
            const [toast, setToast] = useState(null);
            
            const showToast = (msg, type = 'info') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 3000);
            };

            const logout = () => {
                localStorage.removeItem(`bravo_session_${CLIENTE_ID}`);
                setCurrentUser(null);
                setView('home');
            };

            const mutateAndSave = async (mutationCallback) => {
                let optimisticDataForDB;
                setGlobalData(prev => {
                    if (!prev) return prev;
                    const cloned = structuredClone(prev);
                    mutationCallback(cloned);
                    optimisticDataForDB = cloned;
                    return cloned;
                });

                setTimeout(async () => {
                    if (!optimisticDataForDB) return;
                    try {
                        const { data: latest } = await supabase.from('bravo_state').select('data').eq('id', CLIENTE_ID).single();
                        let freshData = optimisticDataForDB;
                        if (latest && latest.data) {
                            freshData = latest.data;
                            mutationCallback(freshData); 
                        }
                        await supabase.from('bravo_state').upsert({ id: CLIENTE_ID, data: freshData });
                    } catch (e) {}
                }, 0);
            };

            const updateAppSetting = (key, value) => {
                mutateAndSave((freshData) => { freshData[key] = value; });
            };

            // Funciones de gestión de alumnos restauradas
            const addClient = () => {
                if (!newClientName.trim()) return;
                const newPin = Math.floor(1000 + Math.random() * 9000).toString();
                const newClient = { id: Date.now().toString(), name: newClientName, pin: newPin };
                
                mutateAndSave((freshData) => {
                    if(!freshData.clients) freshData.clients = [];
                    if(!freshData.routines) freshData.routines = {};
                    if(!freshData.progress) freshData.progress = {};
                    freshData.clients.push(newClient);
                    freshData.routines[newClient.id] = [];
                });
                
                setNewClientName('');
                showToast(`¡Alumno creado! PIN: ${newPin}`);
            };

            const deleteClient = (clientId) => {
                if(window.confirm('¿Seguro que querés eliminar a este alumno y TODAS sus rutinas?')) {
                    mutateAndSave((freshData) => {
                        freshData.clients = freshData.clients.filter(c => c.id !== clientId);
                        delete freshData.routines[clientId];
                        delete freshData.progress[clientId];
                    });
                    showToast('Alumno eliminado correctamente.');
                }
            };

            const editClientName = (clientId, oldName) => {
                const newName = window.prompt('Nuevo nombre del alumno:', oldName);
                if(newName && newName.trim() !== '' && newName !== oldName) {
                    mutateAndSave((freshData) => {
                        const client = freshData.clients.find(c => c.id === clientId);
                        if(client) client.name = newName;
                    });
                    showToast('Nombre actualizado.');
                }
            };

            useEffect(() => {
                fetchData();
                const channel = supabase.channel(`realtime_${CLIENTE_ID}`).on('postgres_changes', { event: '*', schema: 'public', table: 'bravo_state' }, (payload) => {
                    if(payload && payload.new && payload.new.id === CLIENTE_ID) setGlobalData(payload.new.data);
                }).subscribe();
                return () => { supabase.removeChannel(channel); };
            }, []);

            useEffect(() => {
                let interval = null;
                if (view === 'cliente_entrenamiento' && isTrainingStarted) {
                    interval = setInterval(() => setTrainingTime(t => t + 1), 1000);
                } else { clearInterval(interval); }
                return () => clearInterval(interval);
            }, [view, isTrainingStarted]);

            useEffect(() => {
                let restInterval = null;
                if (restTime > 0) {
                    restInterval = setInterval(() => {
                        setRestTime(t => {
                            if (t <= 1) { playAlarm(); return 0; }
                            return t - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(restInterval);
            }, [restTime > 0]);

            const startRest = (timeString) => {
                let t = 90;
                if (timeString) {
                    const parsed = parseInt(timeString.toString().replace(/\D/g, ''));
                    if (!isNaN(parsed)) t = parsed;
                }
                setRestTime(t);
            };

            const formatTime = (secs) => {
                const m = Math.floor(secs / 60).toString().padStart(2, '0');
                const s = (secs % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            };

            const fetchData = async () => {
                try {
                    const { data } = await supabase.from('bravo_state').select('data').eq('id', CLIENTE_ID).single();
                    let dbData = data?.data || { profesorPin: '0000', appTitle1: 'Entrenamiento', appTitle2: 'Y Salud', clients: [], routines: {}, progress: {} };
                    setGlobalData(dbData);
                    
                    const savedSession = localStorage.getItem(`bravo_session_${CLIENTE_ID}`);
                    if (savedSession) {
                        const parsed = JSON.parse(savedSession);
                        if (parsed.type === 'profesor' && parsed.pin === (dbData.profesorPin || '0000')) {
                            setView('profesor');
                        } else if (parsed.type === 'cliente') {
                            const client = dbData.clients?.find(c => c.id === parsed.id);
                            if (client) { setCurrentUser(client); setView('cliente_listado'); }
                        }
                    }
                } catch (e) {
                    setGlobalData({ profesorPin: '0000', appTitle1: 'Entrenamiento', appTitle2: 'Y Salud', clients: [], routines: {}, progress: {} });
                }
                setLoading(false);
            };

            const handleLogin = () => {
                if (!globalData) return;
                unlockAudio(); 
                if (pinInput === (globalData.profesorPin || '0000')) { 
                    localStorage.setItem(`bravo_session_${CLIENTE_ID}`, JSON.stringify({type: 'profesor', pin: pinInput}));
                    setView('profesor'); 
                } else {
                    const client = globalData.clients?.find(c => c.pin === pinInput);
                    if (client) { 
                        localStorage.setItem(`bravo_session_${CLIENTE_ID}`, JSON.stringify({type: 'cliente', id: client.id}));
                        setCurrentUser(client); setView('cliente_listado'); 
                    } else { showToast('PIN incorrecto.', 'error'); }
                }
                setPinInput('');
            };

            if (loading) return <div className="app-container flex justify-center items-center h-screen bg-dark-900 text-brand-500 text-2xl font-bold"><i className="fa-solid fa-fire fa-spin mr-3"></i> Cargando...</div>;

            return (
                <div className="relative">
                    {view !== 'home' && view !== 'landing' && <div className="bg-watermark"><i className="fa-solid fa-dumbbell"></i></div>}

                    {catalogTarget && <ExerciseCatalogModal onClose={() => setCatalogTarget(null)} onSelect={(name) => {
                        const catInfo = EXERCISE_CATALOG.find(e => e.name === name);
                        const { clientId, dayId, secId } = catalogTarget;
                        mutateAndSave((fresh) => {
                            const day = fresh.routines[clientId]?.find(d => d.id === dayId);
                            const sec = day.sections.find(s => s.id === secId);
                            sec.exercises.push({
                                id: Math.random().toString(36).substr(2, 9), name,
                                image: catInfo?.image || null, description: catInfo?.description || '',
                                muscle: catInfo?.muscle || '', equip: catInfo?.equip || '',
                                sets: '4', reps: '10', rir: '2', rest: '90s', isUnilateral: false, weeks: {}
                            });
                        });
                        setCatalogTarget(null);
                    }} />}

                    {toast && (
                        <div className={`fixed top-6 left-1/2 transform -translate-x-1/2 z-50 px-6 py-3 rounded-2xl text-sm font-bold shadow-2xl animate-toast-down text-center flex items-center gap-3 ${toast.type === 'error' ? 'bg-red-600 text-white' : 'bg-brand-500 text-white'}`}>
                            {toast.msg}
                        </div>
                    )}

                    {view === 'home' && (
                        <div className="app-container flex flex-col justify-between p-6 h-screen relative z-10 bg-dark-900">
                            <div className="text-center my-auto">
                                <h1 className="text-4xl font-black text-white uppercase mb-0.5">{globalData?.appTitle1 || 'Entrenamiento'}</h1>
                                <h2 className="text-xl font-bold text-brand-500 tracking-[0.2em] uppercase">{globalData?.appTitle2 || 'Y Salud'}</h2>
                            </div>
                            <div className="glass-panel p-6 rounded-[2rem] shadow-2xl mb-6">
                                <input 
                                    type="password" placeholder="INGRESA TU PIN" 
                                    className="w-full bg-dark-950/50 p-4 rounded-2xl text-center text-xl tracking-[0.4em] outline-none mb-4 text-white border border-white/10 font-bold" 
                                    value={pinInput} onChange={(e) => setPinInput(e.target.value)} 
                                />
                                <button onClick={handleLogin} className="w-full bg-brand-500 text-white py-4 rounded-2xl font-black text-sm uppercase tracking-widest">
                                    Ingresar
                                </button>
                            </div>
                        </div>
                    )}

                    {view === 'profesor' && (
                        <div className="app-container pb-20 relative z-10 bg-dark-900">
                            <header className="p-5 flex justify-between items-center glass-header sticky top-0 z-10">
                                <h2 className="font-black text-xl text-white uppercase">Panel Profe</h2>
                                <button onClick={logout} className="text-xs font-bold text-gray-400 bg-dark-800 px-4 py-2 rounded-xl">Salir</button>
                            </header>
                            
                            <div className="p-5 space-y-4">
                                {/* Formulario para agregar alumnos restaurado */}
                                <div className="flex gap-2 bg-dark-800/80 p-2 rounded-2xl border border-white/5 shadow-inner mb-6">
                                    <input 
                                        className="flex-1 bg-transparent px-4 outline-none text-sm text-white placeholder-gray-500 font-medium" 
                                        placeholder="Nombre del nuevo alumno..." 
                                        value={newClientName} 
                                        onChange={(e) => setNewClientName(e.target.value)} 
                                    />
                                    <button onClick={addClient} className="bg-brand-500 rounded-xl w-11 h-11 flex items-center justify-center text-white hover:bg-brand-600 transition-colors shadow-md font-bold">
                                        <i className="fa-solid fa-plus"></i>
                                    </button>
                                </div>

                                <h3 className="font-black text-xs text-gray-400 uppercase tracking-widest mb-2">Listado de Alumnos</h3>
                                
                                {globalData.clients?.length === 0 && (
                                    <div className="text-center text-gray-500 text-sm py-10">Aún no hay alumnos creados.</div>
                                )}

                                {(globalData.clients || []).map(client => (
                                    <div key={client.id} className="glass-panel p-4 rounded-2xl flex justify-between items-center mb-3 border border-white/5">
                                        <div className="flex-1 cursor-pointer" onClick={() => { setActiveClient(client); setActiveDayId(null); }}>
                                            <p className="font-bold text-base text-white">{client.name}</p>
                                            <p className="text-xs text-brand-500 mt-1 font-semibold">PIN: {client.pin} • <span className="text-gray-400">{(globalData.routines[client.id] || []).length} rutinas</span></p>
                                        </div>
                                        <div className="flex items-center gap-1.5">
                                            <button onClick={() => editClientName(client.id, client.name)} className="text-gray-400 hover:text-brand-500 p-2" title="Editar Nombre"><i className="fa-solid fa-pen"></i></button>
                                            <button onClick={() => deleteClient(client.id)} className="text-gray-400 hover:text-red-500 p-2" title="Eliminar Alumno"><i className="fa-solid fa-trash-can"></i></button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {view === 'cliente_listado' && (
                        <div className="app-container pb-24 relative z-10 bg-dark-900">
                            <header className="p-5 flex justify-between items-center sticky top-0 glass-header z-10">
                                <h1 className="text-sm font-black text-white tracking-widest">{globalData?.appTitle1 || 'Entrenamiento'}</h1>
                                <button onClick={logout} className="text-white bg-dark-800 px-3.5 py-1.5 rounded-xl text-xs font-bold">Salir</button>
                            </header>
                            <div className="p-5">
                                <h2 className="text-xl font-black text-white mb-4">Hola, {currentUser?.name || 'Atleta'}</h2>
                                <div className="flex bg-dark-800 rounded-2xl p-1.5 mb-6">
                                    {[1, 2, 3, 4].map(num => (
                                        <button key={num} onClick={() => setActiveWeek(num)} className={`flex-1 py-2.5 text-xs font-black rounded-xl ${activeWeek === num ? 'bg-brand-500 text-white' : 'text-gray-400'}`}>Sem. {num}</button>
                                    ))}
                                </div>
                                <div className="space-y-4">
                                    {(globalData.routines[currentUser.id] || []).map(day => (
                                        <div key={day.id} onClick={() => { setActiveDayId(day.id); setIsTrainingStarted(false); setView('cliente_entrenamiento'); }} className="glass-panel p-4 rounded-2xl flex items-center gap-4 cursor-pointer">
                                            <div className="w-14 h-14 bg-dark-800 rounded-2xl flex items-center justify-center text-brand-500"><i className="fa-solid fa-dumbbell text-xl"></i></div>
                                            <h4 className="font-bold text-base text-white lowercase">{day.name}</h4>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {view === 'cliente_entrenamiento' && (
                        !isTrainingStarted ? (
                            <div className="app-container pb-24 relative z-10 bg-dark-900">
                                <header className="p-4 flex items-center justify-between sticky top-0 glass-header z-10">
                                    <button onClick={() => setView('cliente_listado')} className="text-brand-500 w-10 h-10 flex items-center justify-center"><i className="fa-solid fa-arrow-left"></i></button>
                                </header>
                                <div className="p-5">
                                    <h2 className="font-black text-3xl lowercase text-white mb-6">{(globalData.routines[currentUser.id]?.find(d => d.id === activeDayId) || {}).name}</h2>
                                    <button onClick={() => { setIsTrainingStarted(true); setTrainingTime(0); setRestTime(0); }} className="w-full bg-brand-500 text-white font-black text-sm uppercase py-4 rounded-2xl shadow-xl">
                                        Empezar Entrenamiento
                                    </button>
                                </div>
                            </div>
                        ) : (
                            <div className="app-container pb-20 relative z-10 bg-dark-900">
                                <header className="p-4 flex items-center justify-between sticky top-0 glass-header z-20">
                                    <span className="text-brand-500 text-xs font-black">{formatTime(trainingTime)}</span>
                                    <button onClick={() => { setIsTrainingStarted(false); setView('cliente_listado'); }} className="bg-dark-800 text-brand-500 px-4 py-2 rounded-xl text-xs font-black">Terminar</button>
                                </header>
                                <div className="p-4 pt-6">
                                    {((globalData.routines[currentUser.id]?.find(d => d.id === activeDayId) || {}).sections || []).map((sec, sIdx) => (
                                        <div key={sIdx} className="mb-6">
                                            <h3 className="font-black text-xs text-brand-500 uppercase tracking-widest mb-3">{sec.name}</h3>
                                            {sec.exercises?.map(ex => (
                                                <ClientExerciseRow 
                                                    key={`${ex.id}-${activeWeek}`} exercise={ex} activeWeek={activeWeek}
                                                    progressData={globalData.progress?.[currentUser.id]?.[activeWeek]?.[ex.id]} 
                                                    previousWeekData={activeWeek > 1 ? globalData.progress?.[currentUser.id]?.[activeWeek - 1]?.[ex.id] : null}
                                                    onSaveProgress={(sets, note) => {
                                                        mutateAndSave((fresh) => {
                                                            if (!fresh.progress) fresh.progress = {};
                                                            if (!fresh.progress[currentUser.id]) fresh.progress[currentUser.id] = {};
                                                            if (!fresh.progress[currentUser.id][activeWeek]) fresh.progress[currentUser.id][activeWeek] = {};
                                                            fresh.progress[currentUser.id][activeWeek][ex.id] = { sets, note };
                                                        });
                                                    }} 
                                                    onStartRest={startRest} showToast={showToast}
                                                />
                                            ))}
                                        </div>
                                    ))}
                                </div>
                                {restTime > 0 && (
                                    <div className="fixed bottom-16 left-1/2 transform -translate-x-1/2 bg-brand-500 text-white px-6 py-3 rounded-2xl font-black text-sm shadow-2xl z-50 flex items-center gap-3 cursor-pointer" onClick={() => setRestTime(0)}>
                                        <i className="fa-solid fa-stopwatch animate-pulse"></i> Descanso: {Math.floor(restTime/60)}:{(restTime%60).toString().padStart(2,'0')}
                                    </div>
                                )}
                            </div>
                        )
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
